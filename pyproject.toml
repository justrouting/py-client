[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "justrouting"
dynamic = ["version"]
description = "Official Python client for the JustRouting API — routing, distance matrices, and vehicle routing optimization across Southeast Asia."
readme = "README.md"
license = "MIT"
authors = [{ name = "justrouting" }]
keywords = ["routing", "osrm", "vroom", "matrix", "optimization", "logistics"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://justrouting.tech"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2", "twine>=5"]

[tool.setuptools.dynamic]
version = {attr = "justrouting.consts.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
justrouting = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit the live JustRouting API (excluded by default)",
]
